<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#090909">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>NZ:P Mobile Controls Preview</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="mobile-build.css?v=menu-audio-grenade-20261119">
</head>
<body>
  <main id="app">
    <header id="bar"><a href="./">NZ:P Mobile</a><span id="status" role="status">Tap Start to load the official game.</span><button id="sound" type="button" aria-label="Enable game sound">SOUND</button><button id="fullscreen" type="button" aria-label="Fullscreen">⛶</button></header>
    <canvas id="canvas" aria-label="NZ:P game screen"></canvas>
    <section id="welcome"><h1>NZ:P Mobile Controls Preview</h1><p>This preview loads the official game files directly from nzp.gay. Touch controls are routed to the game canvas in this page.</p><button id="begin" type="button">Start game</button></section>
    <section id="touch-controls" aria-label="Touch controls" hidden>
      <div id="stick" class="stick" aria-label="Move"><span></span><small>MOVE</small></div>
      <div id="look" aria-label="Right half: drag to aim"><span>DRAG TO AIM</span></div>
      <nav id="menu-controls" aria-label="Menu navigation">
        <div class="menu-pad" role="group" aria-label="Menu directions">
          <button type="button" data-key="ArrowUp" class="menu-up" aria-label="Menu up">▲</button>
          <button type="button" data-key="ArrowLeft" class="menu-left" aria-label="Menu left">◀</button>
          <span>MENU</span>
          <button type="button" data-key="ArrowRight" class="menu-right" aria-label="Menu right">▶</button>
          <button type="button" data-key="ArrowDown" class="menu-down" aria-label="Menu down">▼</button>
        </div>
        <div class="menu-actions" role="group" aria-label="Menu actions">
          <button type="button" data-key="Escape" class="back">PAUSE<br>BACK</button>
          <button type="button" data-key="Enter" class="select">SELECT</button>
        </div>
      </nav>
      <div id="buttons">
        <button type="button" data-key="Space" class="jump">JUMP</button>
        <button type="button" data-key="KeyE" class="use">USE</button>
        <button type="button" data-key="KeyR" class="reload">RELOAD</button>
        <button type="button" data-key="KeyG" class="grenade">GRENADE</button>
        <button type="button" data-ads-toggle="true" class="ads" aria-pressed="false">ADS</button>
        <button type="button" data-fire="true" class="fire">FIRE</button>
      </div>
    </section>
  </main>
  <script src="mobile-build.js?v=menu-audio-grenade-20261119"></script>
</body>
</html>
